[pytest]
# Async mode for pytest-asyncio
asyncio_mode = auto

# Test discovery paths
testpaths = tests

# Default options
addopts = -v --tb=short --cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=60

# Custom markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires Docker services)
    api: API endpoint tests
    slow: Slow tests (skip with -m 'not slow')
    rate_limit: Tests that involve rate limiting (2s sleeps)
    notion_api: Tests requiring Notion API
    vector_search: Tests requiring Qdrant
    performance: Performance benchmark tests

# Ignore warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
