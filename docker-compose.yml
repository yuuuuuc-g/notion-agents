
services:
  # 后端服务：完全保留你原本的资源限制、卷挂载和网络配置
  exocortex:
    build: .
    container_name: exocortex_v2
    ports:
      - "8501:8501"
      - "8000:8000"
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./generated_audio:/app/generated_audio
    depends_on:
      - redis
    networks:
      - exocortex_net
    restart: unless-stopped

  # 🟢 额外新增：BioBrain React 前端 (不干涉后端)
  biobrain_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: biobrain_react
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - exocortex_net
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000 # 映射到你宿主机的端口

  redis:
    image: redis:alpine
    container_name: exocortex_redis
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - redis_data:/data
    networks:
      - exocortex_net

networks:
  exocortex_net:
    driver: bridge

volumes:
  redis_data:
