services:
  exocortex:
    build: .
    container_name: exocortex_v2
    
    # --- 端口映射 ---
    # 左边是电脑端口 : 右边是容器端口
    ports:
      - "8501:8501"  # 前端 Streamlit
      - "8000:8000"  # 后端 API
    
    # --- 环境变量 ---
    # 直接读取你本地的 .env 文件
    env_file:
      - .env
    
    # --- 数据持久化 (Volumes) ---
    # 关键！把容器里的数据文件夹映射到你电脑上
    # 这样即使删了容器，数据还在你硬盘里
    volumes:
      - ./chroma_db:/app/chroma_db           # 向量数据库
      - ./generated_audio:/app/generated_audio # 生成的音频
      - ./doc_store.db:/app/doc_store.db       # SQLite 父文档库
      
    # 自动重启策略
    restart: always