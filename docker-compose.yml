
services:
  # 1. 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: biobrain_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - exocortex_net
    restart: always

  # 2. 后端服务 (FastAPI)
  exocortex:
    build: .
    container_name: exocortex_v2
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./generated_audio:/app/generated_audio
      - .:/app
    depends_on:
      - redis
      - qdrant
    networks:
      - exocortex_net
    restart: unless-stopped

  # 3. 前端服务 (React/Next.js)
  biobrain_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: biobrain_react
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - exocortex_net
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000

  # 4. 缓存服务
  redis:
    image: redis:alpine
    container_name: exocortex_redis
    volumes:
      - redis_data:/data
    networks:
      - exocortex_net

networks:
  exocortex_net:
    driver: bridge

volumes:
  redis_data:
