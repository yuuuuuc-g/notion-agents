# .pre-commit-config.yaml (Exocortex 重构期专用 - 融合版)
exclude: 'node_modules|venv|\.venv'
repos:
  # 1. 基础文件规范：确保文件结构健康
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml               # 检查 YAML 语法
        exclude: 'node_modules|venv|\.venv'
      - id: check-merge-conflict     # 防止提交未解决的冲突冲突
        exclude: 'node_modules|venv|\.venv'
      - id: check-added-large-files  # 拦截大文件（如 PDF/SQLite）
        args: ['--maxkb=1000']
        exclude: 'node_modules|venv|\.venv'
      - id: end-of-file-fixer        # 确保文件末尾有换行
        exclude: 'node_modules|venv|\.venv'
      - id: trailing-whitespace      # 自动修剪行尾空格
        exclude: 'node_modules|venv|\.venv'

  # 2. 代码格式化：Black (Python 界的格式标准)
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        exclude: 'node_modules|venv|\.venv'

  # 3. 极速静态检查：Ruff (替代 Pylint，性能提升百倍)
  # 自动修复简单错误，且对 FastAPI/LangChain 模式更友好
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args:
          - --fix          # 自动修复可修复的错误
          - --select=E,F,W,I # 检查语法错误(E,F)、警告(W)、Import 排序(I)
          - --ignore=E501  # 忽略行长限制（Prompt 通常很长）
        exclude: 'node_modules|venv|\.venv'

  # 4. 关键领域类型检查：Mypy

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: mypy (core logic only)
        # 🔥 关键修复：在这里添加缺失的类型定义包
        additional_dependencies: [
            "types-requests",
            "types-redis",
            "pydantic",
            "langchain"
        ]
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --warn-unused-ignores
        files: |
          ^(
            notion/|
            vector/|
            agent/|
            tools/|
            llm/
          )
        exclude: 'node_modules|venv|\.venv'
